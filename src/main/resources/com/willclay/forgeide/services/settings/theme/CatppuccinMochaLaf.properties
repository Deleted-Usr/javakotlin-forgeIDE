# Catppuccin Mocha palette: https://catppuccin.com/palette
# Panels use Mantle, the editor uses Base, and Mauve is the accent.
@background = #181825
@foreground = #CDD6F4
@accentColor = #CBA6F7
@selectionBackground = #45475A
@selectionForeground = #CDD6F4
@disabledForeground = #6C7086
@componentBackground = #313244
@borderColor = #11111B

Component.accentColor = @accentColor
Component.focusColor = @accentColor
Component.borderColor = @borderColor
Component.linkColor = #89B4FA
Component.arc = 8
Button.arc = 8
Button.default.background = @accentColor
Button.default.foreground = #11111B
Button.toolbar.hoverBackground = #313244
Button.toolbar.pressedBackground = #45475A

Panel.background = @background
MenuBar.background = @background
ToolBar.background = @background
TextPane.background = #1E1E2E
TextPane.foreground = @foreground
TextPane.caretForeground = #F5E0DC
TextPane.selectionBackground = #7F849C
TextArea.background = #1E1E2E
TextArea.foreground = @foreground
TextArea.caretForeground = #F5E0DC
TextArea.selectionBackground = @selectionBackground
Tree.background = @background
Tree.foreground = @foreground
Tree.selectionBackground = @selectionBackground
Tree.selectionForeground = @selectionForeground
Tree.selectionInactiveBackground = #313244
Tree.selectionInactiveForeground = @foreground
Tree.rowHeight = 26
Tree.selectionArc = 6
Tree.selectionInsets = 0,4,0,4

TabbedPane.background = @background
TabbedPane.foreground = #A6ADC8
TabbedPane.selectedBackground = $TextPane.background
TabbedPane.selectedForeground = @foreground
TabbedPane.underlineColor = @accentColor
TabbedPane.inactiveUnderlineColor = #7F849C
TabbedPane.hoverColor = #313244
TabbedPane.contentAreaColor = @borderColor
TabbedPane.tabHeight = 34
TabbedPane.tabSelectionHeight = 2

Separator.foreground = @borderColor
SplitPaneDivider.gripColor = #313244
ScrollBar.track = @background
ScrollBar.thumb = #45475A
ScrollBar.hoverThumbColor = #585B70
ScrollBar.pressedThumbColor = #6C7086

Actions.Green = #A6E3A1
Actions.Red = #F38BA8
Actions.Yellow = #F9E2AF
Actions.Blue = #89B4FA
Objects.Blue = #89B4FA
Objects.Green = #A6E3A1
Objects.Yellow = #F9E2AF
Objects.Purple = #CBA6F7
Objects.Grey = #9399B2

# Code blocks in Markdown previews follow the editor's token colours.
Markdown.code.plain = @foreground
Markdown.code.keyword = #CBA6F7
Markdown.code.function = #89B4FA
Markdown.code.string = #A6E3A1
Markdown.code.number = #FAB387
Markdown.code.comment = #9399B2
Markdown.code.docComment = #A6ADC8
Markdown.code.annotation = #F5C2E7
Markdown.code.punctuation = #9399B2
Markdown.code.selection = #585B70
