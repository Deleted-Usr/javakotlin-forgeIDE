# Shared palette. Semantic status colours stay distinct from the copper accent.
@background = #25272B
@foreground = #E2E4E8
@accentColor = #D99A70
@selectionBackground = #514138
@selectionForeground = #F5F0EB
@disabledForeground = #858A93
@componentBackground = #303338
@borderColor = #3B3E44

Component.accentColor = @accentColor
Component.focusColor = @accentColor
Component.borderColor = @borderColor
Component.arc = 8
Button.arc = 8
Button.default.background = #B8754C
Button.default.foreground = #FFFFFF
Button.toolbar.hoverBackground = #383B41
Button.toolbar.pressedBackground = #454950

Panel.background = @background
MenuBar.background = @background
ToolBar.background = @background
TextPane.background = #1E2024
TextPane.foreground = @foreground
TextPane.caretForeground = @accentColor
TextPane.selectionBackground = #795A46
TextArea.background = #1E2024
TextArea.foreground = @foreground
TextArea.caretForeground = @accentColor
TextArea.selectionBackground = @selectionBackground
Tree.background = @background
Tree.foreground = @foreground
Tree.selectionBackground = @selectionBackground
Tree.selectionForeground = @selectionForeground
Tree.selectionInactiveBackground = #383B41
Tree.selectionInactiveForeground = @foreground
Tree.rowHeight = 26
Tree.selectionArc = 6
Tree.selectionInsets = 0,4,0,4

TabbedPane.background = @background
TabbedPane.foreground = #B8BDC6
TabbedPane.selectedBackground = $TextPane.background
TabbedPane.selectedForeground = @foreground
TabbedPane.underlineColor = @accentColor
TabbedPane.inactiveUnderlineColor = #896B56
TabbedPane.hoverColor = #34373D
TabbedPane.contentAreaColor = @borderColor
TabbedPane.tabHeight = 34
TabbedPane.tabSelectionHeight = 2

Separator.foreground = @borderColor
SplitPaneDivider.gripColor = @borderColor
ScrollBar.track = @background
ScrollBar.thumb = #484D55
ScrollBar.hoverThumbColor = #5C626C
ScrollBar.pressedThumbColor = #737A85

Actions.Green = #8DC59A
Actions.Red = #E47F87
Actions.Yellow = #E1BD78
Actions.Blue = #89B5DF
Objects.Blue = #89B5DF
Objects.Green = #8DC59A
Objects.Yellow = #E1BD78
Objects.Purple = #BEA2E0
Objects.Grey = #A2A9B4
