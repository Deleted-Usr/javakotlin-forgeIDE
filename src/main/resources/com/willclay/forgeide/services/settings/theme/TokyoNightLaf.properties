# Tokyo Night ("Night" variant) palette: https://github.com/folke/tokyonight.nvim
# Panels use the darker sidebar shade; the editor uses the main background.
@background = #16161E
@foreground = #C0CAF5
@accentColor = #7AA2F7
@selectionBackground = #283457
@selectionForeground = #C0CAF5
@disabledForeground = #545C7E
@componentBackground = #1F2335
@borderColor = #101014

Component.accentColor = @accentColor
Component.focusColor = @accentColor
Component.borderColor = @borderColor
Component.linkColor = @accentColor
Component.arc = 8
Button.arc = 8
Button.default.background = #3D59A1
Button.default.foreground = #FFFFFF
Button.toolbar.hoverBackground = #292E42
Button.toolbar.pressedBackground = #343A55

Panel.background = @background
MenuBar.background = @background
ToolBar.background = @background
TextPane.background = #1A1B26
TextPane.foreground = @foreground
TextPane.caretForeground = @foreground
TextPane.selectionBackground = #3D59A1
TextArea.background = #1A1B26
TextArea.foreground = @foreground
TextArea.caretForeground = @foreground
TextArea.selectionBackground = @selectionBackground
Tree.background = @background
Tree.foreground = #A9B1D6
Tree.selectionBackground = @selectionBackground
Tree.selectionForeground = @selectionForeground
Tree.selectionInactiveBackground = #1F2335
Tree.selectionInactiveForeground = #A9B1D6
Tree.rowHeight = 26
Tree.selectionArc = 6
Tree.selectionInsets = 0,4,0,4

TabbedPane.background = @background
TabbedPane.foreground = #737AA2
TabbedPane.selectedBackground = $TextPane.background
TabbedPane.selectedForeground = @foreground
TabbedPane.underlineColor = @accentColor
TabbedPane.inactiveUnderlineColor = #3D59A1
TabbedPane.hoverColor = #1F2335
TabbedPane.contentAreaColor = @borderColor
TabbedPane.tabHeight = 34
TabbedPane.tabSelectionHeight = 2

Separator.foreground = @borderColor
SplitPaneDivider.gripColor = #292E42
ScrollBar.track = @background
ScrollBar.thumb = #292E42
ScrollBar.hoverThumbColor = #414868
ScrollBar.pressedThumbColor = #545C7E

Actions.Green = #9ECE6A
Actions.Red = #F7768E
Actions.Yellow = #E0AF68
Actions.Blue = #7AA2F7
Objects.Blue = #7AA2F7
Objects.Green = #9ECE6A
Objects.Yellow = #E0AF68
Objects.Purple = #BB9AF7
Objects.Grey = #737AA2

# Code blocks in Markdown previews follow the editor's token colours.
Markdown.code.plain = @foreground
Markdown.code.keyword = #BB9AF7
Markdown.code.function = #7AA2F7
Markdown.code.string = #9ECE6A
Markdown.code.number = #FF9E64
Markdown.code.comment = #565F89
Markdown.code.docComment = #5A638C
Markdown.code.annotation = #7DCFFF
Markdown.code.punctuation = #89DDFF
Markdown.code.selection = #3D59A1
