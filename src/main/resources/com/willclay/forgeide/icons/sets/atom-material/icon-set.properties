# An icon set is just this file plus the SVGs it names, all in one folder.
# Copy this folder into ~/.forge/icon-sets/<your-set>/ to start your own.
#
# Keys, checked in this order for a file such as "build.gradle.kts":
#
#   filename.<whole name>   build.gradle.kts, .gitignore, pom.xml ...
#   kind.<declaration>      a source file's main type, once Forge has read it:
#                           class, abstract_class, final_class, sealed_class,
#                           interface, enum, record, annotation, object, exception
#   ext.<extension>         gradle.kts, then kts (longest first, no dot)
#   file                    any other file
#   folder                  every folder
#
# Names are lower case. Any key left out falls back to Forge's own drawn icon,
# so a set can be as small as one line. A file called <name>_dark.svg next to
# <name>.svg is used instead while a dark theme is on.

name   = Atom Material
credit = Icons from Atom Material Icons by Elior "Mallowigi" Boukhobza (MIT licence, see LICENSE)

folder = folder.svg
file   = file.svg

# This set has no class, interface or enum icons, so only exceptions are replaced.
kind.exception = exception.svg

# JVM
ext.java       = java.svg
ext.kt         = kotlin.svg
ext.kts        = kotlin_script.svg
ext.gradle     = gradle.svg
filename.build.gradle.kts    = gradle_kotlin.svg
filename.settings.gradle.kts = gradle_kotlin.svg
filename.pom.xml             = maven.svg

# C and C++
ext.c   = c.svg
ext.cpp = cpp.svg
ext.cc  = cpp.svg
ext.cxx = cpp.svg
ext.h   = h.svg
ext.hpp = h.svg
ext.hh  = h.svg

# Rust
ext.rs = rust.svg

# Documents and configuration
ext.md         = markdown.svg
ext.markdown   = markdown.svg
ext.json       = json.svg
ext.xml        = xml.svg
ext.yaml       = yaml.svg
ext.yml        = yaml.svg
ext.properties = properties.svg
ext.toml       = toml.svg
ext.txt        = text.svg
ext.gitignore  = gitignore.svg

# Images
ext.png  = image.svg
ext.jpg  = image.svg
ext.jpeg = image.svg
ext.gif  = image.svg
ext.bmp  = image.svg
ext.ico  = image.svg
ext.webp = image.svg
ext.svg  = image.svg
