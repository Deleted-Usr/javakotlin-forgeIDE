# An icon set is just this file plus the SVGs it names, all in one folder.
# Copy this folder into ~/.forge/icon-sets/<your-set>/ to start your own.
#
# Keys, checked in this order for a file such as "build.gradle.kts":
#
#   filename.<whole name>     build.gradle.kts, pom.xml ...
#   kind.<language>.<kind>    a source file's main type in one language, once
#   kind.<kind>               Forge has read it. Kinds: class, abstract_class,
#                             final_class, sealed_class, interface, enum,
#                             record, annotation, object, exception.
#                             Languages are ids such as java or kotlin.
#   ext.<extension>           gradle.kts, then kts (longest first, no dot)
#   file                      any other file
#
# And for folders:
#
#   folder.root               the project's own top folder
#   folder.match.<name>       a regex; a folder whose name matches it uses...
#   folder.<name>             ...this icon. Patterns are tried top to bottom
#                             and the first match wins. Case is ignored, and
#                             the regex is searched for, so use ^ and $ to
#                             match a whole name. Write \ as \\ (this is a
#                             .properties file).
#   folder                    any other folder
#
# Names are lower case. Any key left out falls back to Forge's own drawn icon,
# so a set can be as small as one line.
#
# Next to <name>.svg, these are picked up without being listed:
#   <name>_dark.svg   used instead while a dark theme is on
#   <name>_open.svg   the open (expanded) version of a folder icon
#
# "a.svg + b.svg" draws b on top of a, like the final-class marker below.

name   = Atom Material
credit = Icons from Atom Material Icons by Elior "Mallowigi" Boukhobza (MIT licence, see LICENSE and LICENSE-iconGenerator)

file = file.svg

# ---- Types -------------------------------------------------------------------
# Atom has no sealed-class icon, so sealed classes keep Forge's "S" badge in Java.

kind.class          = class.svg
kind.abstract_class = abstractClass.svg
kind.final_class    = class.svg + finalMark.svg
kind.interface      = interface.svg
kind.enum           = enum.svg
kind.record         = record.svg
kind.annotation     = annotationtype.svg
kind.exception      = exception.svg

# Kotlin has its own look. Its classes are final unless marked open, so a
# final mark would be on almost every class; like IntelliJ, it isn't shown.
# A sealed class is always abstract in Kotlin, and a data class is a class.
kind.kotlin.class          = classKotlin.svg
kind.kotlin.final_class    = classKotlin.svg
kind.kotlin.record         = classKotlin.svg
kind.kotlin.abstract_class = abstractClassKotlin.svg
kind.kotlin.sealed_class   = abstractClassKotlin.svg
kind.kotlin.interface      = interfaceKotlin.svg
kind.kotlin.enum           = enumKotlin.svg
kind.kotlin.annotation     = annotationKotlin.svg
kind.kotlin.object         = objectKotlin.svg

# C++ has no icons in Atom Material, so these were drawn for Forge in the same
# style: class, abstract class and enum are Atom's shapes recoloured, the class
# blue matching Atom's cpp.svg (as Kotlin's matches its file icon). Struct (a
# box of fields), union (two members sharing memory) and namespace ({ } scope)
# are new shapes. An exception keeps the shared lightning bolt.
kind.cpp.class          = classCpp.svg
kind.cpp.final_class    = classCpp.svg + finalMark.svg
kind.cpp.abstract_class = abstractClassCpp.svg
kind.cpp.enum           = enumCpp.svg
kind.cpp.struct         = structCpp.svg
kind.cpp.union          = unionCpp.svg
kind.cpp.namespace      = namespaceCpp.svg

# ---- Files -------------------------------------------------------------------

# JVM
ext.java       = java.svg
ext.kt         = kotlin.svg
ext.kts        = kotlin_script.svg
ext.gradle     = gradle.svg
filename.build.gradle.kts    = gradle_kotlin.svg
filename.settings.gradle.kts = gradle_kotlin.svg
filename.pom.xml             = maven.svg

# C and C++
ext.c   = c.svg
ext.cpp = cpp.svg
ext.cc  = cpp.svg
ext.cxx = cpp.svg
ext.h   = h.svg
ext.hpp = h.svg
ext.hh  = h.svg

# Rust
ext.rs = rust.svg

# Documents and configuration
ext.md         = markdown.svg
ext.markdown   = markdown.svg
ext.json       = json.svg
ext.xml        = xml.svg
ext.yaml       = yaml.svg
ext.yml        = yaml.svg
ext.properties = properties.svg
ext.toml       = toml.svg
ext.txt        = text.svg
ext.gitignore  = gitignore.svg

# Images
ext.png  = image.svg
ext.jpg  = image.svg
ext.jpeg = image.svg
ext.gif  = image.svg
ext.bmp  = image.svg
ext.ico  = image.svg
ext.webp = image.svg
ext.svg  = image.svg

# ---- Folders -----------------------------------------------------------------
# Patterns are Atom Material's own (iconGenerator's folder_associations.xml).

folder      = folder.svg
folder.root = folder-root.svg

# Forge's own project folder. Drawn for Forge (not part of Atom Material): the
# anvil and ingot from Forge's app icon, in Atom's folder shape. The open
# version has a _dark twin because an open folder is only an outline, so the
# anvil inside sits on the background and needs a colour for each theme.
folder.match.forge     = ^\\.forge$
folder.forge           = folder-forge.svg

folder.match.sources   = ^[\\._]?(src|sources?|code|buildSrc|snippets?)$
folder.sources         = folder-src.svg
folder.match.main      = ^[\\._]?main$
folder.main            = folder-main.svg
folder.match.tests     = ^[\\._]?(tests?|specs?|units?|__tests?__)$
folder.tests           = folder-tests.svg
folder.match.resources = ^[\\._]?(res|resources?|assets?|reports?)$
folder.resources       = folder-resource.svg
folder.match.docs      = ^[\\._]?(docs?|documentation|texts?|forms?)$
folder.docs            = folder-docs.svg
folder.match.dist      = ^[\\._]?(dist|distributions?|out|builds?|releases?)$
folder.dist            = folder-dist.svg
folder.match.target    = ^[\\._]?targets?$
folder.target          = folder-target.svg
folder.match.lib       = ^[\\._]?(vendors?|libs?|library|libraries|Pods?|stdlib|lib64)$
folder.lib             = folder-lib.svg
folder.match.include   = ^[\\._]?(inc(ludes?)?|imports?|imported|concerns?|deps?|dependencies)$
folder.include         = folder-include.svg
folder.match.scripts   = ^[\\._]?(scripts?|selectors?|polyfills?)$
folder.scripts         = folder-scripts.svg
folder.match.config    = ^[\\._]?(cfg|configs?|conf(iguration)?|settings?|options?|preferences?|prefs?)$
folder.config          = folder-config.svg
folder.match.images    = ^[\\._]?(images?|img|medias?|pics?|pictures?|gallery|figures?|pngs?|jpgs?)$
folder.images          = folder-images.svg
folder.match.fonts     = ^[\\._]?(fonts?|typefaces?|glyphs?)$
folder.fonts           = folder-fonts.svg
folder.match.examples  = ^[\\._]?(examples?|demos?|samples?)$
folder.examples        = folder-examples.svg
folder.match.idea      = ^[\\._]?(idea|META-INF|intellijPlatform)$
folder.idea            = folder-idea.svg
folder.match.git       = ^(\\.git|\\.submodules)$
folder.git             = folder-git.svg
folder.match.github    = ^[\\._]?github$
folder.github          = folder-github.svg
folder.match.gradle    = ^[\\._]?gradle$
folder.gradle          = folder-gradle.svg
folder.match.vscode    = ^[\\._]?vscode(-test)?$
folder.vscode          = folder-vscode.svg
folder.match.java      = ^[\\._]?(java|jdk)$
folder.java            = folder-java.svg
folder.match.kotlin    = ^[\\._]?(kotlin|kt)$
folder.kotlin          = folder-kotlin.svg
